services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${ZT_DB_ROOT_PASSWORD:-zenT@1234561}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${ZT_DB_NAME:-zentao}"
      MYSQL_USER: "${ZT_DB_USER:-zentao}"
      MYSQL_PASSWORD: "${ZT_DB_PASSWORD:-zenT@1234561}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-allowed-packet=256M
      - --net-read-timeout=120
      - --net-write-timeout=120
      - --wait-timeout=28800
    volumes:
      # MySQL refuses to initialize if a bind-mounted datadir contains stray or partial files.
      - /home/daizengtao/zentao/zentao-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  zentao:
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    image: dzentao:v1.10
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8082:80"
    environment:
      # false: use install.php and optional demo data. true: run custom dev/CI database init.
      ZT_AUTO_INIT: "false"
      ZT_DB_HOST: db
      ZT_DB_NAME: "${ZT_DB_NAME:-zentao}"
      ZT_DB_USER: "${ZT_DB_USER:-zentao}"
      ZT_DB_PASSWORD: "${ZT_DB_PASSWORD:-zenT@1234561}"
      ZT_DB_ROOT_PASSWORD: "${ZT_DB_ROOT_PASSWORD:-zenT@1234561}"
      ZT_ADMIN_ACCOUNT: admin
      ZT_ADMIN_PASSWORD: Admin@1234!
      ZT_COMPANY_NAME: 星耀宇航
      PHP_MAX_INPUT_VARS: "5000"
      PHP_POST_MAX_SIZE: "100M"
      PHP_MEMORY_LIMIT: "256M"
    volumes:
      - /home/daizengtao/zentao/zentao-data:/var/www/html/www/data
      - /home/daizengtao/zentao/zentao-tmp:/var/www/html/tmp